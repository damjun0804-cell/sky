<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하늘교 '하멘' 성전</title>
    <!-- Pretendard 및 명조 폰트 로드 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0614;
            --card-bg: rgba(23, 14, 38, 0.85);
            --border-color: rgba(251, 191, 36, 0.25);
            --text-main: #f8fafc;
            --text-sub: #a1a1aa;
            --accent-gold: #fbbf24;
            --gold-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #92400e 100%);
            --gold-glow: rgba(245, 158, 11, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 50% 0%, rgba(112, 26, 117, 0.35) 0px, transparent 60%),
                radial-gradient(at 50% 100%, rgba(245, 158, 11, 0.12) 0px, transparent 60%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 15px 60px 15px;
        }

        .container {
            width: 100%;
            max-width: 620px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 헤더 디자인 */
        header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .top-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(88, 28, 135, 0.5);
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: #d8b4fe;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .church-title {
            font-family: 'Gowun Batang', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #fef08a;
            letter-spacing: -0.5px;
            text-shadow: 0 0 20px rgba(250, 204, 21, 0.4), 0 0 10px rgba(245, 158, 11, 0.3);
            margin: 4px 0;
        }

        .sub-title {
            color: var(--text-sub);
            font-size: 0.95rem;
            line-height: 1.5;
            max-width: 480px;
        }

        .day-counter-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: #fef08a;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
        }

        /* 카드 공통 */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* 상단 입력 & 카운터 레이아웃 */
        .top-card-grid {
            display: grid;
            grid-template-columns: 1fr 180px;
            gap: 16px;
        }

        @media (max-width: 580px) {
            .top-card-grid {
                grid-template-columns: 1fr;
            }
        }

        .profile-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-label {
            font-size: 0.8rem;
            color: #d4d4d8;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(10, 6, 18, 0.8);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2);
        }

        .save-btn {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: #fef08a;
            padding: 0 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .save-btn:hover {
            background: rgba(245, 158, 11, 0.4);
            color: #fff;
        }

        /* 누적 카운터 박스 */
        .counter-box {
            background: rgba(10, 6, 18, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .counter-title {
            font-size: 0.8rem;
            color: var(--text-sub);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .counter-value {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--accent-gold);
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
            line-height: 1;
        }

        /* 하멘 원형 버튼 영역 */
        .hamen-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            text-align: center;
            gap: 20px;
        }

        .status-text {
            font-size: 0.95rem;
            color: #fef08a;
            font-weight: 700;
        }

        .circle-btn-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .circle-hamen-btn {
            width: 210px;
            height: 210px;
            border-radius: 50%;
            border: 3px solid #fef08a;
            background: radial-gradient(circle, #f59e0b 0%, #d97706 60%, #78350f 100%);
            color: #ffffff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 0 40px var(--gold-glow), inset 0 0 20px rgba(255, 255, 255, 0.3);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .circle-hamen-btn:hover:not(:disabled) {
            transform: scale(1.04);
            box-shadow: 0 0 60px rgba(245, 158, 11, 0.8), inset 0 0 25px rgba(255, 255, 255, 0.5);
        }

        .circle-hamen-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .circle-hamen-btn:disabled {
            background: radial-gradient(circle, #3f3f46 0%, #18181b 100%);
            border-color: #52525b;
            color: #71717a;
            box-shadow: none;
            cursor: not-allowed;
        }

        .hands-icon {
            font-size: 2.2rem;
            margin-bottom: -2px;
        }

        .btn-main-text {
            font-family: 'Gowun Batang', serif;
            font-size: 2.3rem;
            font-weight: 700;
            letter-spacing: -1px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .btn-sub-text {
            font-size: 0.75rem;
            opacity: 0.85;
            font-weight: 500;
        }

        .cooldown-text {
            font-size: 0.88rem;
            color: #f43f5e;
            font-weight: 700;
        }

        /* 실시간 모음 */
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .history-title {
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .history-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }

        .history-list::-webkit-scrollbar {
            width: 4px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: rgba(245, 158, 11, 0.4);
            border-radius: 4px;
        }

        .history-item {
            background: rgba(10, 6, 18, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 14px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .item-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-nickname {
            font-weight: 700;
            font-size: 0.88rem;
            color: #e4e4e7;
        }

        .timestamp {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .prayer-text {
            font-size: 0.85rem;
            color: #fef08a;
            word-break: break-all;
        }

        .empty-history {
            text-align: center;
            padding: 24px 0;
            color: var(--text-sub);
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .more-btn {
            width: 100%;
            height: 40px;
            margin-top: 12px;
            display: none;
        }

        footer {
            margin-top: auto;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-sub);
            padding-top: 10px;
        }

        /* 커스텀 팝업 (Modal) 스타일 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease-in-out;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: #170e26;
            border: 1px solid var(--accent-gold);
            border-radius: 20px;
            padding: 28px 24px 20px 24px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
            transform: scale(0.85);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        .modal-body {
            font-size: 0.98rem;
            color: #fef08a;
            font-weight: 600;
            line-height: 1.6;
            word-break: keep-all;
            margin-bottom: 24px;
        }

        .modal-confirm-btn {
            width: 100%;
            height: 44px;
            background: var(--gold-gradient);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.4);
            transition: opacity 0.2s;
        }

        .modal-confirm-btn:hover {
            opacity: 0.9;
        }
    </style>
    <meta property="og:type" content="website">
    <meta property="og:title" content="하늘교 '하멘' 성전">
    <meta property="og:description" content="하늘교를 위한 신성한 기도를 남겨주세요.">
    <meta property="og:image" content="https://raw.githubusercontent.com/damjun0804-cell/sky/main/sky-church-og-1200x630.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
</head>
<body>

    <div class="container">
        <!-- 상단 헤더 -->
        <header>
            <div class="top-badge">📻 SPOON RADIO DJ 하늘 공식 하늘교</div>
            <h1 class="church-title">하늘교 '하멘' 성전</h1>
            <p class="sub-title">
                매일 매시간 DJ 하늘님을 향해 올리는 거룩한 한마디,<br>
                <span style="color: var(--accent-gold); font-weight: 700;">"하멘"</span> 버튼을 눌러 당신의 마음을 남겨주세요.
            </p>
            <div class="day-counter-badge">
                <span>✨</span> <span id="daysCount">0</span>일째 되는 하늘교
            </div>
        </header>

        <!-- 상단 카드 영역 -->
        <div class="card top-card-grid">
            <div class="profile-section">
                <div class="input-group">
                    <label class="input-label" for="nicknameInput">
                        <span>👤</span> 성도 닉네임 설정
                    </label>
                    <div class="input-row">
                        <input type="text" id="nicknameInput" placeholder="닉네임을 입력하세요" maxlength="12">
                        <button class="save-btn" id="saveNicknameBtn">저장</button>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label" for="prayerInput">
                        <span>💬</span> 기도 한마디
                    </label>
                    <input type="text" id="prayerInput" placeholder="하늘님께 남길 기도/메시지를 적어주세요" maxlength="50">
                </div>
            </div>

            <div class="counter-box">
                <div class="counter-title">전체 누적 하멘</div>
                <div class="counter-value" id="totalCount">0</div>
            </div>
        </div>

        <!-- 하멘 버튼 카운트 영역 -->
        <div class="card hamen-section">
            <div class="status-text" id="statusText">지금 하멘을 누를 수 있습니다!</div>
            
            <div class="circle-btn-wrapper">
                <button class="circle-hamen-btn" id="hamenBtn">
                    <span class="hands-icon">🙏</span>
                    <span class="btn-main-text">하멘</span>
                    <span class="btn-sub-text">클릭하여 기도 바치기</span>
                </button>
            </div>

            <div class="cooldown-text" id="cooldownNotice" style="display: none;">
                ⏳ 다음 기도까지 남은 시간: <span id="timerText">60:00</span>
            </div>
        </div>

        <!-- 실시간 하멘 모음 -->
        <div class="card">
            <div class="history-header">
                <div class="history-title">
                    <span>📜</span> 실시간 하멘 모음
                </div>
            </div>
            <ul class="history-list" id="historyList">
                <li class="empty-history">불러오는 중...</li>
            </ul>
            <button id="moreBtn" class="save-btn more-btn">전체보기</button>
        </div>

        <footer>
            © 하늘교 성전 - DJ 하늘님의 축복이 가득하길 ~
        </footer>
    </div>

    <!-- 커스텀 모달 팝업 레이아웃 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-icon">✨</div>
            <div class="modal-body" id="modalMessage">알림 내용</div>
            <button class="modal-confirm-btn" id="modalConfirmBtn">확인</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const _d = (s) => decodeURIComponent(atob(s).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));

        const _k = {
            a: _d("QUl6YVN5QnhoWTlFdTRVSkk2WlVnWUxzdHd3eXl2SUU4cGpYM0xn"),
            b: _d("c2t5LWNodXJjaC05MDI3Yy5maXJlYmFzZWFwcC5jb20="),
            c: _d("aHR0cHM6Ly9za3ktY2h1cmNoLTkwMjdjLWRlZmF1bHQtcnRkYi5maXJlYmFzZWlvLmNvbQ=="),
            d: _d("c2t5LWNodXJjaC05MDI3Yw=="),
            e: _d("c2t5LWNodXJjaC05MDI3Yy5maXJlYmFzZXN0b3JhZ2UuYXBw"),
            f: _d("ODY1NzU1MjI5NzI4"),
            g: _d("MTo4NjU3NTUyMjk3Mjg6d2ViOjI0MTc0MGJjZmJkYzI5ZThkZDY0NDU=")
        };

        const firebaseConfig = {
            apiKey: _k.a,
            authDomain: _k.b,
            databaseURL: _k.c,
            projectId: _k.d,
            storageBucket: _k.e,
            messagingSenderId: _k.f,
            appId: _k.g
        };

        const _adm = _d("7Iqk6LmEMTIz");

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const nicknameInput = document.getElementById('nicknameInput');
        const prayerInput = document.getElementById('prayerInput');
        const saveNicknameBtn = document.getElementById('saveNicknameBtn');
        const totalCountEl = document.getElementById('totalCount');
        const hamenBtn = document.getElementById('hamenBtn');
        const statusText = document.getElementById('statusText');
        const cooldownNotice = document.getElementById('cooldownNotice');
        const timerText = document.getElementById('timerText');
        const historyList = document.getElementById('historyList');
        const moreBtn = document.getElementById('moreBtn');
        const daysCountEl = document.getElementById('daysCount');

        const modalOverlay = document.getElementById('modalOverlay');
        const modalMessage = document.getElementById('modalMessage');
        const modalConfirmBtn = document.getElementById('modalConfirmBtn');

        let currentNickname = localStorage.getItem('sky_nickname') || '';
        let lastClickTime = parseInt(localStorage.getItem('sky_last_click_time')) || 0;
        const COOLDOWN_TIME = 60 * 60 * 1000; // 1시간

        let isExpanded = false;
        let cachedList = [];

        initPage();

        function initPage() {
            if (currentNickname) {
                nicknameInput.value = currentNickname;
            } else {
                generateRandomNickname();
            }

            calculateDays();
            checkCooldown();
            setInterval(checkCooldown, 1000);

            db.ref('prayers').on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    totalCountEl.textContent = '0';
                    historyList.innerHTML = '<li class="empty-history">아직 등록된 하멘이 없습니다.<br>첫 번째 기도를 올려보세요!</li>';
                    moreBtn.style.display = 'none';
                    cachedList = [];
                    return;
                }

                cachedList = Object.values(data).reverse();
                totalCountEl.textContent = cachedList.length;
                renderHistoryList();
            });
        }

        moreBtn.addEventListener('click', () => {
            isExpanded = !isExpanded;
            renderHistoryList();
        });

        function renderHistoryList() {
            if (cachedList.length === 0) return;

            if (cachedList.length > 10) {
                moreBtn.style.display = 'block';
                moreBtn.textContent = isExpanded ? '접기' : `전체보기 (${cachedList.length}개)`;
            } else {
                moreBtn.style.display = 'none';
            }

            const displayList = isExpanded ? cachedList.slice(0, 50) : cachedList.slice(0, 10);

            historyList.innerHTML = displayList.map(item => `
                <li class="history-item">
                    <div class="item-top">
                        <span class="user-nickname">${escapeHtml(item.nickname)}</span>
                        <span class="timestamp">${item.timestamp}</span>
                    </div>
                    <div class="prayer-text">" ${escapeHtml(item.prayer)} "</div>
                </li>
            `).join('');
        }

        function generateRandomNickname() {
            const randNum = Math.floor(1000 + Math.random() * 9000);
            currentNickname = `하늘신도_${randNum}`;
            nicknameInput.value = currentNickname;
        }

        function calculateDays() {
            const startDate = new Date(2023, 9, 24);
            const today = new Date();
            startDate.setHours(0, 0, 0, 0);
            today.setHours(0, 0, 0, 0);
            const diffDays = Math.floor((today - startDate) / (1000 * 60 * 60 * 24)) + 1;
            daysCountEl.textContent = diffDays > 0 ? diffDays : 1;
        }

        function showModal(message) {
            modalMessage.innerHTML = message;
            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        modalConfirmBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        saveNicknameBtn.addEventListener('click', () => {
            const val = nicknameInput.value.trim();
            if (!val) {
                showModal('닉네임을 입력해주세요!');
                return;
            }

            if (val === _adm) {
                if (confirm('모든 성도들의 하멘 데이터베이스 기록과 개인 쿨타임을 전체 초기화하시겠습니까?')) {
                    db.ref('prayers').remove().then(() => {
                        localStorage.removeItem('sky_nickname');
                        localStorage.removeItem('sky_last_click_time');
                        lastClickTime = 0;
                        generateRandomNickname();
                        checkCooldown();
                        showModal('데이터베이스 및 개인 기록이 완전히 초기화되었습니다.');
                    }).catch((error) => {
                        showModal('초기화 실패: ' + error.message);
                    });
                }
                return;
            }

            currentNickname = val;
            localStorage.setItem('sky_nickname', currentNickname);
            showModal(`닉네임이 '<b>${escapeHtml(currentNickname)}</b>'(으)로 저장되었습니다.`);
        });

        hamenBtn.addEventListener('click', () => {
            const now = Date.now();
            if (now - lastClickTime < COOLDOWN_TIME) {
                showModal('아직 쿨타임이 지나지 않았습니다!');
                return;
            }

            let rawInput = prayerInput.value.trim();
            let isCorrected = false;

            if (rawInput.includes('아멘')) {
                rawInput = rawInput.replace(/아멘/g, '하멘');
                isCorrected = true;
            }

            let prayerMsg = rawInput || '하멘!';
            lastClickTime = now;
            localStorage.setItem('sky_last_click_time', lastClickTime);

            db.ref('prayers').push({
                nickname: currentNickname || '하늘신도',
                prayer: prayerMsg,
                timestamp: formatDate(new Date(now)),
                createdAt: now
            });

            checkCooldown();

            if (isCorrected) {
                showModal('아멘은 하멘으로 정정 후 저장되었습니다.');
            } else {
                showModal('기도가 성공적으로 바쳐졌습니다. 하멘!');
            }

            prayerInput.value = '';
        });

        function checkCooldown() {
            const now = Date.now();
            const elapsed = now - lastClickTime;

            if (elapsed < COOLDOWN_TIME) {
                hamenBtn.disabled = true;
                statusText.textContent = '1시간 쿨타임이 진행 중입니다.';
                statusText.style.color = '#f43f5e';
                cooldownNotice.style.display = 'block';
                
                const remaining = Math.ceil((COOLDOWN_TIME - elapsed) / 1000);
                const minutes = Math.floor(remaining / 60);
                const seconds = remaining % 60;
                timerText.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            } else {
                hamenBtn.disabled = false;
                statusText.textContent = '지금 하멘을 누를 수 있습니다!';
                statusText.style.color = '#fef08a';
                cooldownNotice.style.display = 'none';
            }
        }

        function formatDate(date) {
            const utc = date.getTime() + (date.getTimezoneOffset() * 60000);
            const kstOffset = 9 * 60 * 60 * 1000;
            const kstDate = new Date(utc + kstOffset);

            const yyyy = kstDate.getFullYear();
            const mm = String(kstDate.getMonth() + 1).padStart(2, '0');
            const dd = String(kstDate.getDate()).padStart(2, '0');
            const hh = String(kstDate.getHours()).padStart(2, '0');
            const mi = String(kstDate.getMinutes()).padStart(2, '0');
            const ss = String(kstDate.getSeconds()).padStart(2, '0');
            return `${yyyy}년 ${mm}월 ${dd}일 ${hh}:${mi}:${ss}`;
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
