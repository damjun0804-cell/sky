<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하늘교 하멘 성전</title>
    <!-- Pretendard 웹폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            --primary-hover-gradient: linear-gradient(135deg, #c084fc 0%, #9333ea 100%);
            --bg-color: #0b0f19;
            --card-bg: rgba(20, 15, 38, 0.75);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-gold: #fbbf24;
            --purple-glow: rgba(168, 85, 247, 0.4);
            --border-color: rgba(168, 85, 247, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(168, 85, 247, 0.28) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(251, 191, 36, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(124, 58, 237, 0.1) 0px, transparent 70%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px 60px 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        header {
            text-align: center;
            padding: 10px 0;
        }

        .church-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            text-shadow: 0 0 25px rgba(168, 85, 247, 0.8), 0 0 10px rgba(168, 85, 247, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .sub-title {
            color: var(--text-sub);
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .day-counter-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 14px;
            background: rgba(251, 191, 36, 0.12);
            border: 1px solid rgba(251, 191, 36, 0.35);
            color: var(--accent-gold);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 600;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.15);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6), 0 0 20px rgba(168, 85, 247, 0.05);
        }

        .profile-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-label {
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(11, 15, 25, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            border-color: #c084fc;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.3);
        }

        .save-btn {
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid var(--border-color);
            color: #e9d5ff;
            padding: 0 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .save-btn:hover {
            background: rgba(168, 85, 247, 0.4);
            color: #fff;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
        }

        .counter-section {
            text-align: center;
            padding: 12px 0;
        }

        .counter-title {
            font-size: 0.85rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .counter-value {
            font-size: 3.6rem;
            font-weight: 900;
            color: var(--accent-gold);
            text-shadow: 0 0 25px rgba(251, 191, 36, 0.5);
            line-height: 1.1;
        }

        .hamen-btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .hamen-btn {
            width: 100%;
            height: 64px;
            border: none;
            border-radius: 16px;
            background: var(--primary-gradient);
            color: white;
            font-size: 1.35rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 25px var(--purple-glow), 0 0 15px rgba(168, 85, 247, 0.3);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .hamen-btn:hover:not(:disabled) {
            background: var(--primary-hover-gradient);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(168, 85, 247, 0.6), 0 0 20px rgba(192, 132, 252, 0.4);
        }

        .hamen-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .hamen-btn:disabled {
            background: #1e293b;
            color: #64748b;
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: not-allowed;
            box-shadow: none;
        }

        .cooldown-text {
            font-size: 0.85rem;
            color: #f43f5e;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .history-title {
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .view-toggle-btn {
            background: rgba(168, 85, 247, 0.12);
            border: 1px solid var(--border-color);
            color: #d8b4fe;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .view-toggle-btn:hover {
            background: rgba(168, 85, 247, 0.25);
            color: #fff;
        }

        .history-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .history-list::-webkit-scrollbar {
            width: 4px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.4);
            border-radius: 4px;
        }

        .history-item {
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.15);
            padding: 12px 14px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .item-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-nickname {
            font-weight: 700;
            font-size: 0.9rem;
            color: #e2e8f0;
        }

        .timestamp {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .prayer-text {
            font-size: 0.88rem;
            color: var(--accent-gold);
            line-height: 1.35;
            word-break: break-all;
        }

        .empty-history {
            text-align: center;
            padding: 30px 0;
            color: var(--text-sub);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        footer {
            margin-top: auto;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-sub);
            padding-top: 20px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #2e1065;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 15px rgba(168, 85, 247, 0.4);
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 class="church-title">✨ 하늘교 성전 ✨</h1>
            <p class="sub-title">DJ 하늘을 향한 마음을 모아 기도합시다</p>
            <div class="day-counter-badge">
                <span>🙏</span> <span id="daysCount">0</span>일째 되는 하늘교
            </div>
        </header>

        <!-- 프로필 & 기도문 설정 -->
        <div class="card profile-section">
            <div class="input-group">
                <label class="input-label" for="nicknameInput">신도 닉네임</label>
                <div class="input-row">
                    <input type="text" id="nicknameInput" placeholder="닉네임을 입력하세요" maxlength="12">
                    <button class="save-btn" id="saveNicknameBtn">저장</button>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label" for="prayerInput">기도 한마디</label>
                <input type="text" id="prayerInput" placeholder="하늘님께 전할 기도를 입력하세요 (기본: 하멘!)" maxlength="50">
            </div>
        </div>

        <!-- 누적 카운터 -->
        <div class="card counter-section">
            <div class="counter-title">전체 누적 하멘</div>
            <div class="counter-value" id="totalCount">0</div>
        </div>

        <!-- 하멘 클릭 버튼 -->
        <div class="hamen-btn-container">
            <button class="hamen-btn" id="hamenBtn">
                <span>🙏</span> 하멘! 누르기
            </button>
            <div class="cooldown-text" id="cooldownNotice" style="display: none;">
                ⏳ 다음 기도까지 남은 시간: <span id="timerText">60:00</span>
            </div>
        </div>

        <!-- 실시간 기록실 -->
        <div class="card">
            <div class="history-header">
                <div class="history-title">
                    <span>📜</span> 실시간 하멘 모음
                </div>
                <button class="view-toggle-btn" id="viewToggleBtn">전체보기 (0개)</button>
            </div>
            <ul class="history-list" id="historyList">
                <li class="empty-history">아직 등록된 하멘이 없습니다.<br>첫 번째 기도를 올려보세요!</li>
            </ul>
        </div>

        <footer>
            © 하늘교 성전 - DJ 하늘님의 축복이 가득하길! 2026.09.20
        </footer>
    </div>

    <div class="toast" id="toast">메시지</div>

    <script>
        const nicknameInput = document.getElementById('nicknameInput');
        const prayerInput = document.getElementById('prayerInput');
        const saveNicknameBtn = document.getElementById('saveNicknameBtn');
        const totalCountEl = document.getElementById('totalCount');
        const hamenBtn = document.getElementById('hamenBtn');
        const cooldownNotice = document.getElementById('cooldownNotice');
        const timerText = document.getElementById('timerText');
        const historyList = document.getElementById('historyList');
        const toast = document.getElementById('toast');
        const daysCountEl = document.getElementById('daysCount');
        const viewToggleBtn = document.getElementById('viewToggleBtn');

        let currentNickname = localStorage.getItem('sky_nickname') || '';
        let historyData = JSON.parse(localStorage.getItem('sky_hamen_history')) || [];
        let lastClickTime = parseInt(localStorage.getItem('sky_last_click_time')) || 0;
        let isShowAll = false;
        const COOLDOWN_TIME = 60 * 60 * 1000;

        initPage();

        function initPage() {
            if (currentNickname) {
                nicknameInput.value = currentNickname;
            } else {
                currentNickname = '무명 신도';
            }

            calculateDays();
            updateHistoryUI();
            checkCooldown();

            setInterval(checkCooldown, 1000);
        }

        function calculateDays() {
            const startDate = new Date(2023, 9, 24);
            const today = new Date();
            
            startDate.setHours(0, 0, 0, 0);
            today.setHours(0, 0, 0, 0);
            
            const diffTime = today - startDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
            
            daysCountEl.textContent = diffDays > 0 ? diffDays : 1;
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        saveNicknameBtn.addEventListener('click', () => {
            const val = nicknameInput.value.trim();

            if (val === '스비123') {
                localStorage.removeItem('sky_hamen_history');
                localStorage.removeItem('sky_last_click_time');
                historyData = [];
                lastClickTime = 0;
                
                updateHistoryUI();
                checkCooldown();
                showToast('🔑 전체 기록 및 쿨타임이 초기화되었습니다.');
                nicknameInput.value = currentNickname !== '스비123' ? currentNickname : '';
                return;
            }

            if (!val) {
                showToast('닉네임을 입력해주세요!');
                return;
            }

            currentNickname = val;
            localStorage.setItem('sky_nickname', currentNickname);
            showToast(`닉네임이 '${currentNickname}'(으)로 저장되었습니다.`);
        });

        viewToggleBtn.addEventListener('click', () => {
            isShowAll = !isShowAll;
            updateHistoryUI();
        });

        hamenBtn.addEventListener('click', () => {
            const now = Date.now();
            
            if (now - lastClickTime < COOLDOWN_TIME) {
                showToast('아직 쿨타임이 지나지 않았습니다!');
                return;
            }

            let prayerMsg = prayerInput.value.trim();
            if (!prayerMsg) {
                prayerMsg = '하멘!';
            }

            lastClickTime = now;
            localStorage.setItem('sky_last_click_time', lastClickTime);

            const newRecord = {
                nickname: currentNickname || '무명 신도',
                prayer: prayerMsg,
                timestamp: formatDate(new Date(now))
            };

            historyData.unshift(newRecord);
            localStorage.setItem('sky_hamen_history', JSON.stringify(historyData));

            updateHistoryUI();
            checkCooldown();
            showToast('기도가 성공적으로 등록되었습니다. 하멘!');
            
            prayerInput.value = '';
        });

        function updateHistoryUI() {
            totalCountEl.textContent = historyData.length;
            viewToggleBtn.textContent = isShowAll ? `접기 (총 ${historyData.length}개)` : `전체보기 (${historyData.length}개)`;

            if (historyData.length === 0) {
                historyList.innerHTML = '<li class="empty-history">아직 등록된 하멘이 없습니다.<br>첫 번째 기도를 올려보세요!</li>';
                return;
            }

            const displayItems = isShowAll ? historyData : historyData.slice(0, 5);

            historyList.innerHTML = displayItems.map(item => `
                <li class="history-item">
                    <div class="item-top">
                        <span class="user-nickname">${escapeHtml(item.nickname)}</span>
                        <span class="timestamp">${item.timestamp}</span>
                    </div>
                    <div class="prayer-text">" ${escapeHtml(item.prayer)} "</div>
                </li>
            `).join('');
        }

        function checkCooldown() {
            const now = Date.now();
            const elapsed = now - lastClickTime;

            if (elapsed < COOLDOWN_TIME) {
                hamenBtn.disabled = true;
                cooldownNotice.style.display = 'flex';
                
                const remaining = Math.ceil((COOLDOWN_TIME - elapsed) / 1000);
                const minutes = Math.floor(remaining / 60);
                const seconds = remaining % 60;
                
                timerText.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            } else {
                hamenBtn.disabled = false;
                cooldownNotice.style.display = 'none';
            }
        }

        function formatDate(date) {
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            const hh = String(date.getHours()).padStart(2, '0');
            const mi = String(date.getMinutes()).padStart(2, '0');
            const ss = String(date.getSeconds()).padStart(2, '0');
            return `${yyyy}년 ${mm}월 ${dd}일 ${hh}:${mi}:${ss}`;
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
