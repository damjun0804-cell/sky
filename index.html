<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>하늘교 '하멘' 성전</title>
  <style>
    :root {
      --primary-color: #8A2BE2;
      --secondary-color: #4B0082;
      --background-color: #0d001a;
      --card-bg: #1a0033;
      --text-color: #e6ccff;
      --gold-accent: #ffd700;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--background-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(138, 43, 226, 0.4);
      border: 1px solid var(--primary-color);
      box-sizing: border-box;
    }

    h1, h2 {
      text-align: center;
      color: var(--gold-accent);
      margin-bottom: 20px;
    }

    .counter-box {
      text-align: center;
      background: rgba(138, 43, 226, 0.2);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .counter {
      font-size: 2em;
      font-weight: bold;
      color: var(--gold-accent);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid var(--primary-color);
      background-color: #2a0052;
      color: #fff;
      box-sizing: border-box;
      font-family: inherit;
    }

    textarea {
      height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: var(--secondary-color);
    }

    button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }

    .timer {
      text-align: center;
      margin-top: 10px;
      color: #ff9999;
      font-size: 0.9em;
    }

    .prayer-list {
      margin-top: 30px;
    }

    .prayer-item {
      background: rgba(255, 255, 255, 0.05);
      border-left: 4px solid var(--gold-accent);
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 0 5px 5px 0;
    }

    .prayer-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85em;
      color: #aaa;
      margin-bottom: 8px;
    }

    /* 줄바꿈 및 공백 유지를 위한 스타일 설정 */
    .prayer-content {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }
  </style>
  
  <!-- Firebase SDK 추가 -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="container">
    <h1>🙏 하늘교 '하멘' 성전 🙏</h1>
    
    <div class="counter-box">
      <div>개교 후 경과일: <span id="daysCount">0</span>일</div>
      <div>누적 기도 수</div>
      <div class="counter" id="totalPrayers">0</div>
    </div>

    <form id="prayerForm">
      <div class="form-group">
        <label for="nickname">닉네임</label>
        <input type="text" id="nickname" required placeholder="닉네임을 입력하세요">
      </div>
      <div class="form-group">
        <label for="prayerMessage">기도 문구</label>
        <textarea id="prayerMessage" required placeholder="기도 문구를 작성하세요 (엔터로 줄바꿈 가능)"></textarea>
      </div>
      <button type="submit" id="submitBtn">하멘 (기도하기)</button>
      <div class="timer" id="cooldownTimer"></div>
    </form>

    <div class="prayer-list">
      <h2>최근 기도 목록</h2>
      <div id="prayersContainer"></div>
    </div>
  </div>

  <script>
    // Firebase 설정
    const firebaseConfig = {
      // 실제 Firebase 프로젝트 설정 값을 넣어야 합니다.
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      databaseURL: "https://YOUR_PROJECT_ID.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const prayersRef = database.ref('prayers');

    // 개교 경과일 계산 (2023년 10월 24일 기준)
    const startDate = new Date('2023-10-24');
    const today = new Date();
    const diffTime = Math.abs(today - startDate);
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    document.getElementById('daysCount').textContent = diffDays;

    // DOM 요소
    const prayerForm = document.getElementById('prayerForm');
    const nicknameInput = document.getElementById('nickname');
    const prayerMessageInput = document.getElementById('prayerMessage');
    const submitBtn = document.getElementById('submitBtn');
    const cooldownTimer = document.getElementById('cooldownTimer');
    const prayersContainer = document.getElementById('prayersContainer');
    const totalPrayersElement = document.getElementById('totalPrayers');

    // 쿨타임 처리 (1시간)
    const COOLDOWN_TIME = 60 * 60 * 1000;
    
    function checkCooldown() {
      const lastSubmit = localStorage.getItem('lastPrayerTime');
      if (lastSubmit) {
        const now = new Date().getTime();
        const timePassed = now - parseInt(lastSubmit);
        
        if (timePassed < COOLDOWN_TIME) {
          const remainingTime = COOLDOWN_TIME - timePassed;
          startTimer(remainingTime);
          return true;
        }
      }
      return false;
    }

    function startTimer(duration) {
      submitBtn.disabled = true;
      let timer = duration / 1000;
      
      const interval = setInterval(() => {
        const minutes = parseInt(timer / 60, 10);
        const seconds = parseInt(timer % 60, 10);

        cooldownTimer.textContent = `다음 기도까지 남은 시간: ${minutes}분 ${seconds < 10 ? '0' + seconds : seconds}초`;

        if (--timer < 0) {
          clearInterval(interval);
          submitBtn.disabled = false;
          cooldownTimer.textContent = '';
          localStorage.removeItem('lastPrayerTime');
        }
      }, 1000);
    }

    checkCooldown();

    // 폼 제출 이벤트
    prayerForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const nickname = nicknameInput.value.trim();
      let prayerText = prayerMessageInput.value;

      // 관리자 초기화 키워드 체크 (7Iqk6LmEMTIz 디코딩)
      if (nickname === atob('N0lxazZMbUVNVEl6')) {
        if (confirm('전체 데이터베이스 및 개인 기록을 초기화하시겠습니까?')) {
          prayersRef.remove();
          localStorage.clear();
          alert('초기화되었습니다.');
          location.reload();
          return;
        }
      }

      if (checkCooldown()) {
        alert('아직 쿨타임이 지나지 않았습니다.');
        return;
      }

      // '아멘' -> '하멘' 자동 치환
      prayerText = prayerText.replace(/아멘/g, '하멘');

      // Firebase 데이터 저장
      const newPrayerRef = prayersRef.push();
      newPrayerRef.set({
        nickname: nickname,
        prayer: prayerText,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      }).then(() => {
        localStorage.setItem('lastPrayerTime', new Date().getTime().toString());
        prayerMessageInput.value = '';
        checkCooldown();
      }).catch((error) => {
        console.error("저장 실패:", error);
      });
    });

    // 실시간 데이터 수신 및 화면 표시
    prayersRef.on('value', (snapshot) => {
      prayersContainer.innerHTML = '';
      const data = snapshot.val();
      
      if (data) {
        const prayersList = Object.values(data);
        totalPrayersElement.textContent = prayersList.length;

        // 최신순 정렬 후 표시
        prayersList.reverse().forEach((prayerData) => {
          const item = document.createElement('div');
          item.className = 'prayer-item';

          const header = document.createElement('div');
          header.className = 'prayer-header';
          
          const date = prayerData.timestamp ? new Date(prayerData.timestamp).toLocaleString() : '';
          header.innerHTML = `<span><b>${escapeHtml(prayerData.nickname)}</b></span><span>${date}</span>`;

          const prayerElement = document.createElement('div');
          prayerElement.className = 'prayer-content';

          const rawPrayer = prayerData.prayer || '';
          prayerElement.textContent = rawPrayer.replace(/\\n/g, '\n');

          item.appendChild(header);
          item.appendChild(prayerElement);
          prayersContainer.appendChild(item);
        });
      } else {
        totalPrayersElement.textContent = '0';
      }
    });

    // XSS 방지용 이스케이프 함수
    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
