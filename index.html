<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하늘교 하멘 성전</title>
    <style>
        :root {
            --primary-color: #3a86ff;
            --primary-hover: #2563eb;
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-gold: #fbbf24;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(58, 134, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(251, 191, 36, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px 60px 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0 10px 0;
        }

        .church-title {
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            text-shadow: 0 0 20px rgba(58, 134, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .sub-title {
            color: var(--text-sub);
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .day-counter-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            background: rgba(251, 191, 36, 0.12);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: var(--accent-gold);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .profile-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-label {
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(58, 134, 255, 0.2);
        }

        .save-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0 16px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .save-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .counter-section {
            text-align: center;
            padding: 10px 0;
        }

        .counter-title {
            font-size: 0.85rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .counter-value {
            font-size: 3.2rem;
            font-weight: 900;
            color: var(--accent-gold);
            text-shadow: 0 0 25px rgba(251, 191, 36, 0.3);
            line-height: 1.1;
        }

        .hamen-btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .hamen-btn {
            width: 100%;
            height: 64px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: white;
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(58, 134, 255, 0.4);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .hamen-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(58, 134, 255, 0.5);
        }

        .hamen-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .hamen-btn:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
        }

        .cooldown-text {
            font-size: 0.85rem;
            color: #f43f5e;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .history-title {
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .view-toggle-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .view-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-main);
        }

        .history-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .history-list::-webkit-scrollbar {
            width: 4px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .history-item {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 14px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .item-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-nickname {
            font-weight: 700;
            font-size: 0.9rem;
            color: #e2e8f0;
        }

        .timestamp {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .prayer-text {
            font-size: 0.88rem;
            color: var(--accent-gold);
            line-height: 1.35;
            word-break: break-all;
        }

        .empty-history {
            text-align: center;
            padding: 30px 0;
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        footer {
            margin-top: auto;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-sub);
            padding-top: 20px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 class="church-title">✨ 하늘교 성전 ✨</h1>
            <p class="sub-title">DJ 하늘을 향한 마음을 모아 기도합시다</p>
            <div class="day-counter-badge">
                <span>🙏</span> <span id="daysCount">0</span>일째 되는 하늘교
            </div>
        </header>

        <!-- 프로필 & 기도문 설정 -->
        <div class="card profile-section">
            <div class="input-group">
                <label class="input-label" for="nicknameInput">신도 닉네임</label>
                <div class="input-row">
                    <input type="text" id="nicknameInput" placeholder="닉네임을 입력하세요" maxlength="12">
                    <button class="save-btn" id="saveNicknameBtn">저장</button>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label" for="prayerInput">기도 한마디</label>
                <input type="text" id="prayerInput" placeholder="하늘님께 전할 기도를 입력하세요 (기본: 하멘!)" maxlength="50">
            </div>
        </div>

        <!-- 누적 카운터 -->
        <div class="card counter-section">
            <div class="counter-title">전체 누적 하멘</div>
            <div class="counter-value" id="totalCount">0</div>
        </div>

        <!-- 하멘 클릭 버튼 -->
        <div class="hamen-btn-container">
            <button class="hamen-btn" id="hamenBtn">
                <span>🙏</span> 하멘! 누르기
            </button>
            <div class="cooldown-text" id="cooldownNotice" style="display: none;">
                ⏳ 다음 기도까지 남은 시간: <span id="timerText">60:00</span>
            </div>
        </div>

        <!-- 실시간 기록실 -->
        <div class="card">
            <div class="history-header">
                <div class="history-title">
                    <span>📜</span> 실시간 하멘 모음
                </div>
                <button class="view-toggle-btn" id="viewToggleBtn">전체보기 (0개)</button>
            </div>
            <ul class="history-list" id="historyList">
                <li class="empty-history">아직 등록된 하멘이 없습니다.<br>첫 번째 기도를 올려보세요!</li>
            </ul>
        </div>

        <footer>
            © 하늘교 성전 - DJ 하늘님의 축복이 가득하길!
        </footer>
    </div>

    <div class="toast" id="toast">메시지</div>

    <script>
        // DOM 요소
        const nicknameInput = document.getElementById('nicknameInput');
        const prayerInput = document.getElementById('prayerInput');
        const saveNicknameBtn = document.getElementById('saveNicknameBtn');
        const totalCountEl = document.getElementById('totalCount');
        const hamenBtn = document.getElementById('hamenBtn');
        const cooldownNotice = document.getElementById('cooldownNotice');
        const timerText = document.getElementById('timerText');
        const historyList = document.getElementById('historyList');
        const toast = document.getElementById('toast');
        const daysCountEl = document.getElementById('daysCount');
        const viewToggleBtn = document.getElementById('viewToggleBtn');

        // 상태 변수
        let currentNickname = localStorage.getItem('sky_nickname') || '';
        let historyData = JSON.parse(localStorage.getItem('sky_hamen_history')) || [];
        let lastClickTime = parseInt(localStorage.getItem('sky_last_click_time')) || 0;
        let isShowAll = false; // 전체보기 여부
        const COOLDOWN_TIME = 60 * 60 * 1000; // 1시간 (밀리초)

        // 초기화
        initPage();

        function initPage() {
            // 닉네임 설정
            if (currentNickname) {
                nicknameInput.value = currentNickname;
            } else {
                currentNickname = '무명 신도';
            }

            // 날짜 경과 계산 (2023년 10월 24일 기준)
            calculateDays();

            // 기록 및 카운트 불러오기
            updateHistoryUI();
            checkCooldown();

            // 1초마다 타이머 및 쿨다운 체크
            setInterval(checkCooldown, 1000);
        }

        // 경과 일수 계산 (2023-10-24 기준)
        function calculateDays() {
            const startDate = new Date(2023, 9, 24); // 10월은 index 9
            const today = new Date();
            
            startDate.setHours(0, 0, 0, 0);
            today.setHours(0, 0, 0, 0);
            
            const diffTime = today - startDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1; // 당일 1일째 처리
            
            daysCountEl.textContent = diffDays > 0 ? diffDays : 1;
        }

        // 토스트 메시지
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // 닉네임 저장 및 비밀 초기화 명령어
        saveNicknameBtn.addEventListener('click', () => {
            const val = nicknameInput.value.trim();

            // 비밀 초기화 코드: '스비123'
            if (val === '스비123') {
                localStorage.removeItem('sky_hamen_history');
                localStorage.removeItem('sky_last_click_time');
                historyData = [];
                lastClickTime = 0;
                
                updateHistoryUI();
                checkCooldown();
                showToast('🔑 전체 기록 및 쿨타임이 초기화되었습니다.');
                nicknameInput.value = currentNickname !== '스비123' ? currentNickname : '';
                return;
            }

            if (!val) {
                showToast('닉네임을 입력해주세요!');
                return;
            }

            currentNickname = val;
            localStorage.setItem('sky_nickname', currentNickname);
            showToast(`닉네임이 '${currentNickname}'(으)로 저장되었습니다.`);
        });

        // '전체보기' / '접기' 토글 버튼
        viewToggleBtn.addEventListener('click', () => {
            isShowAll = !isShowAll;
            updateHistoryUI();
        });

        // 하멘 클릭 버튼 이벤트
        hamenBtn.addEventListener('click', () => {
            const now = Date.now();
            
            if (now - lastClickTime < COOLDOWN_TIME) {
                showToast('아직 쿨타임이 지나지 않았습니다!');
                return;
            }

            // 기도문 세팅
            let prayerMsg = prayerInput.value.trim();
            if (!prayerMsg) {
                prayerMsg = '하멘!';
            }

            // 저장 처리
            lastClickTime = now;
            localStorage.setItem('sky_last_click_time', lastClickTime);

            const newRecord = {
                nickname: currentNickname || '무명 신도',
                prayer: prayerMsg,
                timestamp: formatDate(new Date(now))
            };

            historyData.unshift(newRecord); // 최신글이 제일 위로
            localStorage.setItem('sky_hamen_history', JSON.stringify(historyData));

            // UI 업데이트
            updateHistoryUI();
            checkCooldown();
            showToast('기도가 성공적으로 등록되었습니다. 하멘!');
            
            // 기도문 입력창 비우기
            prayerInput.value = '';
        });

        // UI 갱신 (누적 카운터 & 목록)
        function updateHistoryUI() {
            totalCountEl.textContent = historyData.length;
            viewToggleBtn.textContent = isShowAll ? `접기 (총 ${historyData.length}개)` : `전체보기 (${historyData.length}개)`;

            if (historyData.length === 0) {
                historyList.innerHTML = '<li class="empty-history">아직 등록된 하멘이 없습니다.<br>첫 번째 기도를 올려보세요!</li>';
                return;
            }

            // 최근 5개 또는 전체 목록 노출 설정
            const displayItems = isShowAll ? historyData : historyData.slice(0, 5);

            historyList.innerHTML = displayItems.map(item => `
                <li class="history-item">
                    <div class="item-top">
                        <span class="user-nickname">${escapeHtml(item.nickname)}</span>
                        <span class="timestamp">${item.timestamp}</span>
                    </div>
                    <div class="prayer-text">" ${escapeHtml(item.prayer)} "</div>
                </li>
            `).join('');
        }

        // 쿨다운 타이머 체크
        function checkCooldown() {
            const now = Date.now();
            const elapsed = now - lastClickTime;

            if (elapsed < COOLDOWN_TIME) {
                hamenBtn.disabled = true;
                cooldownNotice.style.display = 'flex';
                
                const remaining = Math.ceil((COOLDOWN_TIME - elapsed) / 1000);
                const minutes = Math.floor(remaining / 60);
                const seconds = remaining % 60;
                
                timerText.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            } else {
                hamenBtn.disabled = false;
                cooldownNotice.style.display = 'none';
            }
        }

        // 날짜 포맷팅 (YYYY년 MM월 DD일 HH:mm:ss)
        function formatDate(date) {
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            const hh = String(date.getHours()).padStart(2, '0');
            const mi = String(date.getMinutes()).padStart(2, '0');
            const ss = String(date.getSeconds()).padStart(2, '0');
            return `${yyyy}년 ${mm}월 ${dd}일 ${hh}:${mi}:${ss}`;
        }

        // XSS 방지 태그 변환
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
